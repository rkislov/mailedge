server:
  smtp:
    # Порт 25 по умолчанию (root или CAP_NET_BIND_SERVICE).
    # Для локальной разработки: ["127.0.0.1:2525"]
    listen: ["0.0.0.0:25"]
    # SMTPS (implicit TLS):
    # implicit_tls_listen: ["0.0.0.0:465"]
    hostname: mail.example.com
    max_message_bytes: 26214400   # 25 MiB
    max_recipients: 100
    read_timeout: 60s
    write_timeout: 60s
    tls: true                     # STARTTLS при наличии сертификата
  web:
    listen: "0.0.0.0:8443"
    tls: true
  control_socket: ""
  pid_file: ""

tls:
  dir: ./data/certs
  default: default
  profiles:
    default:
      # source: file | acme | selfsigned
      source: file
      cert: live/fullchain.pem
      key: live/privkey.pem
      # domains: ["mail.example.com"]
  ca:
    system: true
    # extra_files: ["/etc/mgw/ca/corp-root.pem"]
    # extra_dir: ./data/certs/ca
  acme:
    enabled: false
    email: admin@example.com
    directory: https://acme-v02.api.letsencrypt.org/directory
    # staging: https://acme-staging-v02.api.letsencrypt.org/directory
    challenge: http-01            # http-01 | tls-alpn-01
    http_bind: ":80"
    agree_tos: false
    domains: ["mail.example.com"]

storage:
  driver: sqlite
  data_dir: ./data
  sqlite:
    path: ./data/mgw.db
    journal_mode: WAL

relay:
  # Если задан smart_host — вся исходящая почта идёт туда.
  # Иначе используется MX-lookup по домену получателя.
  smart_host: ""
  helo: mail.example.com
  workers: 2
  max_attempts: 8
  initial_backoff: 30s
  max_backoff: 1h

logging:
  level: info          # debug | info | warn | error
  format: json         # json | text

policy:
  default_action: accept
  # rules:
  #   - id: block-evil
  #     enabled: true
  #     priority: 10
  #     action: reject
  #     reason: blocked sender
  #     match:
  #       from: "*@evil.example"
  #       remote_ip: "1.2.3.0/24"
  rules: []

filters:
  dmarc:
    enabled: true
    authserv_id: ""           # defaults to server.smtp.hostname
    honor_policy: true        # apply DMARC p=/sp= on fail
    add_header: true          # Authentication-Results
    on_fail: ""               # optional override: reject | quarantine | tag | accept
    on_tempfail: pass         # pass | reject | quarantine
  dnsbl:
    enabled: false
    cache_ttl: 1h
    whitelist:
      - 127.0.0.0/8
      - 10.0.0.0/8
      - 192.168.0.0/16
    zones: []
    # zones:
    #   - zone: zen.spamhaus.org
    #     weight: 10
    #     action: reject   # score | reject | quarantine | tag
  antispam:
    enabled: true
    tag_score: 5
    quarantine_score: 10
    reject_score: 15
    rules:
      - id: subject_pharma
        weight: 5
        header: Subject
        regex: "(?i)\\b(viagra|cialis|levitra)\\b"
      - id: body_casino
        weight: 3
        regex: "(?i)\\b(online casino|poker freeroll)\\b"
  av:
    enabled: false
    timeout: 15s
    on_unavailable: pass      # pass | quarantine | reject
    on_infected: reject       # reject | quarantine | tag
    # max_bytes: 26214400
    servers: []
    # servers:
    #   - addr: "127.0.0.1:1344"
    #     service: avscan       # c-icap / ClamAV
    #     tls: false
  sandbox:
    enabled: false
    url: ""                   # POST JSON {sha256,filename,content_base64}
    api_key: ""
    timeout: 30s
    cache_ttl: 24h
    on_unavailable: pass
    on_malicious: reject
    on_suspicious: tag
    max_bytes: 10485760
    attachments_only: false
  intel:
    enabled: false
    on_hit: reject            # reject | quarantine | tag
    refresh_interval: 1h
    threatfox:
      enabled: false
      days: 1
      # url: https://threatfox-api.abuse.ch/api/v1/
    qfeed:
      enabled: false
      url: ""                 # JSON array [{type,value,threat}]
      auth_header: ""
